;color:var(--muted)}h1{font:normal clamp(38px,5vw,66px)/1.08 Georgia,serif;letter-spacing:-1.9px;margin:16px 0 22px}h2{font:normal 29px/1.2 Georgia,serif;margin:10px 0 16px}h3{font-size:17px;line-height:1.35;margin:0 0 12px}p{margin:12px 0}main{max-width:1280px;margin:auto;padding:35px 26px 0}.hero{display:grid;grid-template-columns:1.45fr 1fr;gap:50px;align-items:center;margin:0 0 34px}.hero p{max-width:590px;color:var(--muted)}.art{border-radius:90px 90px 15px 15px;background:var(--soft);padding:36px 25px;position:relative;text-align:center;overflow:hidden}.art em{font:italic 41px Georgia;display:block}.art .big{font-size:59px;line-height:1.3}.art .blocks{display:flex;justify-content:center;gap:6px;margin-top:22px}.art .blocks span{border:1px solid var(--line);background:var(--paper);padding:8px 11px;border-radius:6px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}.stat,.panel{border:1px solid var(--line);border-radius:15px;background:var(--paper);padding:23px}.stat{padding:16px 20px}.stat strong{display:block;font:31px Georgia}.stat span{font-size:12px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:30px}.muted{color:var(--muted)}.small{font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.filters input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 13px}.filters button{font-size:12px}.filters .active{background:var(--soft);border-color:var(--green)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.lesson-card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:15px;background:var(--paper);padding:21px}.lesson-card:hover{box-shadow:var(--shadow);border-color:var(--green)}.lesson-card h3{font-size:19px;margin-top:13px}.lesson-card p{font-size:13px;color:var(--muted);flex:1}.lesson-card button{align-self:flex-start;background:var(--soft);border:0}.card-top{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}.badge{font-size:11px;color:var(--green);font-weight:700}.bar{background:var(--soft);height:7px;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.study-layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:27px}.sidebar{align-self:start;position:sticky;top:15px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:15px;max-height:85vh;overflow:auto}.sidebar button{display:block;width:100%;text-align:left;background:none;border:0;font-size:12px;padding:9px;min-height:42px}.sidebar button.current{background:var(--soft);font-weight:700}.sidebar .group{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:16px 7px 5px}.reading{max-width:870px}.reading h1{font-size:clamp(33px,4vw,48px);margin:16px 0}.reading .lead{color:var(--muted);font-size:17px}.rule{border-left:4px solid var(--green);background:var(--soft);padding:20px 24px;border-radius:0 12px 12px 0;font-size:17px;margin:25px 0}.formula{border:1px dashed var(--green);padding:18px;border-radius:10px;font-weight:700;text-align:center;overflow-wrap:anywhere}.text p{margin:18px 0}.example{padding:18px 0;border-bottom:1px solid var(--line)}.example:last-child{border:0}.example button{display:block;border:0;background:transparent;font:24px/1.4 Georgia;padding:0;min-height:40px;text-align:left;color:var(--green)}.example .translation{margin:3px 0 8px}.example .note{font-size:12px;color:var(--muted)}.tip{background:var(--soft);border-radius:12px;padding:20px;margin:20px 0}.tip b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}.lesson-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin:25px 0}.exercise{padding:24px;border:1px solid var(--line);border-radius:15px;background:var(--paper);margin:15px 0}.exercise .question{font-size:19px;font-weight:600;margin:18px 0}.options{display:grid;gap:9px}.option{text-align:left;display:flex;gap:10px;align-items:center}.option b{border:1px solid var(--line);border-radius:6px;padding:1px 9px;font-size:11px}.option.correct{border:2px solid var(--good);color:var(--good);background:var(--soft)}.option.wrong{border:2px solid var(--bad);color:var(--bad)}.feedback{padding:16px;background:var(--soft);border-radius:10px;margin-top:16px}.feedback.wrong{color:var(--bad)}.feedback p{color:var(--ink);margin:7px 0}.result{text-align:center;padding:35px}.result strong{font:58px Georgia;color:var(--green)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:15px}.progress-row{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid var(--line);padding:15px 0}.progress-row button{font-size:12px}.progress-row p{margin:0}.progress-row small{color:var(--muted)}select{max-width:100%;background:var(--paper);border:1px solid var(--line);padding:10px;border-radius:9px}.settings{display:flex;gap:16px;flex-wrap:wrap;align-items:center}label{font-size:13px}details{border-bottom:1px solid var(--line);padding:16px 0}summary{cursor:pointer;font-weight:650;min-height:34px}footer{margin-top:48px;padding:25px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line);text-align:center}footer a{display:block;color:var(--ink);padding:20px 0 8px;text-decoration:none;overflow-wrap:anywhere}footer a:hover{text-decoration:underline}#toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:12px;z-index:50;max-width:90vw}.empty{text-align:center;padding:40px;grid-column:1/-1}.mobile-index{display:none}dialog{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:15px;max-width:450px;width:90%;padding:24px}dialog::backdrop{background:#0008}.spaced{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}input[type=file]{max-width:100%;font-size:12px}button,a,summary{-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth} @media(max-width:1000px){header{gap:15px}.tools{margin-left:auto}nav{margin-left:0}.study-layout{grid-template-columns:195px minmax(0,1fr);gap:18px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){header{padding:13px 16px}.logo{font-size:19px}nav{order:3;width:100%;justify-content:space-between}nav button{padding:8px 12px}.tools button{font-size:11px;padding:7px}.hero{grid-template-columns:1fr;gap:15px}.art{display:none}main{padding:24px 16px 0}.stats{grid-template-columns:1fr 1fr}.stat{padding:14px}.study-layout{display:block}.sidebar{display:none}.mobile-index{display:block;width:100%;margin-bottom:22px}.twocol{grid-template-columns:1fr}.settings{flex-direction:column;align-items:stretch}.settings label{display:flex;justify-content:space-between;gap:10px;align-items:center}.settings select{max-width:65%}.section-head{align-items:start}.reading .panel{padding:20px}.exercise{padding:18px}}@media(max-width:420px){.cards{grid-template-columns:1fr}.tools{gap:4px}.tools button{padding:5px 7px}.logo small{font-size:8px}.hero h1{font-size:41px}.section-head{display:block}.progress-row{grid-template-columns:1fr}.reading h1{font-size:33px}.example button{font-size:21px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}

const LESSONS=[{"title": "El orden de una oración", "goal": "Reconocer quién hace qué.", "rule": "En una oración afirmativa básica, el orden habitual es sujeto + verbo + complemento.", "explanation": "El sujeto indica de quién hablamos: I (yo), Ana, my brother (mi hermano). El verbo expresa una acción o un estado. El complemento añade información: qué, dónde o cuándo.\nEn español podemos decir «Trabajo aquí» sin mencionar «yo». En inglés normalmente necesitamos expresar el sujeto: I work here. No traduzcas palabra por palabra; identifica las piezas.\nNo todas las oraciones llevan objeto: Birds fly es completa. Más adelante aprenderás cómo cambia el orden al hacer preguntas.", "form": "Quién → qué hace → información adicional", "examples": [["I study English.", "Yo estudio inglés.", "I = sujeto; study = verbo; English = lo que estudio."], ["Ana works here.", "Ana trabaja aquí.", "Ana = sujeto; works = verbo; here = lugar."], ["Birds fly.", "Las aves vuelan.", "Una oración puede tener solo sujeto y verbo."]], "trap": "Evita omitir el sujeto: «Study English» puede sonar a una orden, no a «yo estudio inglés».", "questions": [{"prompt": "Elige «Yo estudio inglés».", "options": ["English I study.", "I study English.", "Study I English."], "answer": 1, "why": "El orden básico es I + study + English."}, {"prompt": "¿Qué palabra es el verbo en «Birds fly»?", "options": ["Birds", "fly", "No hay verbo"], "answer": 1, "why": "Fly expresa la acción de volar."}, {"prompt": "Para decir «Trabajo aquí», elige:", "options": ["Work here.", "I work here.", "Here I."], "answer": 1, "why": "I hace explícito el sujeto «yo»."}]}, {"title": "Pronombres personales", "goal": "Sustituir nombres por I, you, he, she, it, we y they.", "rule": "I = yo; you = tú/usted/ustedes; he = él; she = ella; it = cosa, animal o situación; we = nosotros; they = ellos/ellas.", "explanation": "Un pronombre evita repetir el nombre: Ana studies → She studies. You sirve tanto para una persona como para varias; el contexto aclara el número.\nIt se usa mucho para cosas, clima y hora. Para una mascota conocida también puedes usar he o she. They también puede referirse a una persona cuando no se conoce o no se especifica su género.\nI siempre se escribe con mayúscula. Estos son pronombres de sujeto; después aprenderás me, him, her y otros pronombres de objeto.", "form": "Nombre del sujeto → pronombre adecuado", "examples": [["I am Sonia.", "Soy Sonia.", "I siempre lleva mayúscula."], ["We study together.", "Estudiamos juntos.", "We incluye a quien habla."], ["It is cold.", "Hace frío.", "En inglés el clima lleva el sujeto it."]], "trap": "No confundas he (él) con she (ella), ni we (nosotros) con they (ellos).", "questions": [{"prompt": "Ana and I →", "options": ["We", "They", "It"], "answer": 0, "why": "Ana y yo incluye a quien habla: we."}, {"prompt": "My phone →", "options": ["He", "It", "We"], "answer": 1, "why": "Un teléfono se puede sustituir por it."}, {"prompt": "«You» puede significar:", "options": ["Solo tú", "Tú, usted o ustedes", "Solo ellos"], "answer": 1, "why": "You no distingue por sí solo singular y plural."}]}, {"title": "To be: am, is, are", "goal": "Decir quién eres, cómo estás y dónde estás.", "rule": "I am · he/she/it is · you/we/they are.", "explanation": "To be puede equivaler a ser o estar; la traducción depende de la idea. I am happy significa estoy feliz y I am a teacher significa soy docente.\nElige la forma según el sujeto, no según el significado en español. Usa is con una persona o cosa en tercera persona; usa are con we, they y you.\nPara la edad se usa be: I am twenty, no I have twenty. Las profesiones singulares suelen llevar a o an: She is a doctor.", "form": "Sujeto + am/is/are + descripción o lugar", "examples": [["I am happy.", "Estoy feliz.", "Con I usamos am."], ["She is a teacher.", "Ella es docente.", "Con she usamos is."], ["They are at home.", "Están en casa.", "Con they usamos are."]], "trap": "«I have 20 years» no es la forma habitual de decir la edad: I am 20 years old.", "questions": [{"prompt": "I ___ ready.", "options": ["is", "am", "are"], "answer": 1, "why": "I se combina con am."}, {"prompt": "They ___ here.", "options": ["am", "is", "are"], "answer": 2, "why": "They se combina con are."}, {"prompt": "She ___ a doctor.", "options": ["are", "is", "am"], "answer": 1, "why": "She se combina con is."}]}, {"title": "To be: negar y preguntar", "goal": "Formar negativas y preguntas con be.", "rule": "Negativa: sujeto + be + not. Pregunta: be + sujeto + complemento + ?.", "explanation": "Para negar, añade not después de am, is o are. Para preguntar, coloca esa forma de be antes del sujeto. No necesitas do ni does.\nLas contracciones son comunes: I am → I’m; is not → isn’t; are not → aren’t. I’m not es correcta; «I amn’t» no es la forma estándar habitual.\nLas respuestas cortas repiten be: Are you ready? Yes, I am. No, I’m not. En una respuesta afirmativa corta usamos I am, no solo I’m.", "form": "She is ready. → She is not ready. → Is she ready?", "examples": [["Are you tired?", "¿Estás cansado?", "Are va antes de you."], ["He is not here.", "Él no está aquí.", "Not va después de is."], ["Yes, I am.", "Sí.", "Respuesta afirmativa corta sin contraer am."]], "trap": "Evita «Do you are…?». Con be invierte directamente: Are you…?", "questions": [{"prompt": "Pregunta correcta:", "options": ["Is she happy?", "Does she is happy?", "She is happy? only"], "answer": 0, "why": "Is va antes del sujeto she."}, {"prompt": "Negativa de «They are here»:", "options": ["They not are here.", "They are not here.", "They do not are here."], "answer": 1, "why": "Not se coloca después de are."}, {"prompt": "Are you ready? Respuesta corta afirmativa:", "options": ["Yes, I’m.", "Yes, I am.", "Yes, I be."], "answer": 1, "why": "La forma afirmativa corta termina con am sin contracción."}]}, {"title": "A, an y the", "goal": "Elegir entre una cosa cualquiera y una identificada.", "rule": "A/an presenta una unidad no identificada; the señala algo identificable por el contexto.", "explanation": "Usamos a antes de sonido consonante y an antes de sonido vocal. Importa el sonido, no la letra: an hour, pero a university.\nA/an se usa con sustantivos contables en singular: a book. The sirve con singular, plural e incontables cuando sabemos de qué hablamos: the book on the table.\nPara hablar en general a menudo no usamos artículo con plurales o incontables: I like books; Water is important. No antepongas a a water cuando hablas de agua en general.", "form": "a book · an apple · the book on my desk", "examples": [["I have a book.", "Tengo un libro.", "Presentamos un libro sin identificarlo."], ["The book is red.", "El libro es rojo.", "Ya sabemos qué libro."], ["She is an artist.", "Ella es artista.", "Artist empieza con sonido vocal."]], "trap": "An no depende solo de la primera letra: a university empieza con sonido /y/.", "questions": [{"prompt": "___ apple", "options": ["a", "an", "the only"], "answer": 1, "why": "Apple empieza con sonido vocal."}, {"prompt": "___ university", "options": ["an", "a", "am"], "answer": 1, "why": "University empieza con sonido consonante /y/."}, {"prompt": "Hablas del libro específico sobre la mesa:", "options": ["a book on the table, siempre", "the book on the table", "an book on the table"], "answer": 1, "why": "The identifica el libro por su ubicación."}]}, {"title": "Singular y plural", "goal": "Hablar de una o varias cosas.", "rule": "El plural suele añadir -s; algunos añaden -es, cambian -y por -ies o son irregulares.", "explanation": "Book → books. Tras sonidos como los de box o bus, suele aparecer -es: boxes, buses. Con consonante + y, cambia a -ies: city → cities; con vocal + y, solo -s: toy → toys.\nHay plurales irregulares: child → children, person → people, man → men. No todos se pueden deducir: apréndelos con un ejemplo.\nEl artículo a/an desaparece en plural: a book → books. El verbo también puede cambiar: The child is here → The children are here.", "form": "a city → two cities · a child → three children", "examples": [["These are books.", "Estos son libros.", "Book añade -s."], ["Two children are here.", "Hay dos niños aquí.", "Child tiene plural irregular."], ["I like cities.", "Me gustan las ciudades.", "City cambia y por ies."]], "trap": "No escribas «two childs»: el plural de child es children.", "questions": [{"prompt": "Plural de city:", "options": ["citys", "cities", "cityes"], "answer": 1, "why": "Consonante + y cambia a -ies."}, {"prompt": "Plural de child:", "options": ["childs", "childes", "children"], "answer": 2, "why": "Children es un plural irregular."}, {"prompt": "Two books ___ here.", "options": ["is", "am", "are"], "answer": 2, "why": "El sujeto es plural: are."}]}, {"title": "Adjetivos y demostrativos", "goal": "Describir cosas y señalar su distancia.", "rule": "El adjetivo suele ir antes del sustantivo y no cambia por género o número. This/these señalan cercanía; that/those, distancia.", "explanation": "A red car → un coche rojo. Two red cars → dos coches rojos. Red no recibe -s ni cambia si describes algo femenino o masculino.\nTambién puedes describir después de be: The car is red. Es otra estructura válida. No combines ambas como «a car is red» si solo quieres decir «un coche rojo» dentro de una frase.\nThis y that son singulares. These y those son plurales. Puedes usarlos con nombre (these books) o solos si se entiende la referencia (These are mine).", "form": "this book / these books · that car / those cars", "examples": [["This is a small house.", "Esta es una casa pequeña.", "Small va antes de house."], ["Those cars are red.", "Aquellos coches son rojos.", "Those señala plural y distancia."], ["I have two blue bags.", "Tengo dos bolsas azules.", "Blue no cambia en plural."]], "trap": "Evita «two blues bags»: los adjetivos normalmente no llevan plural.", "questions": [{"prompt": "«Dos libros rojos»:", "options": ["two reds books", "two red books", "two books reds"], "answer": 1, "why": "El adjetivo va antes y no cambia."}, {"prompt": "Cerca y plural:", "options": ["this", "that", "these"], "answer": 2, "why": "These se usa para varios elementos cercanos."}, {"prompt": "Lejos y singular:", "options": ["those", "that", "these"], "answer": 1, "why": "That señala un elemento distante."}]}, {"title": "Posesivos y have", "goal": "Expresar pertenencia y posesión.", "rule": "My, your, his, her, its, our, their van antes de un sustantivo. Have/has expresa tener.", "explanation": "My book = mi libro; her book = su libro de ella. El posesivo depende de quién posee, no del objeto. His sister puede referirse a la hermana de él.\nEn presente afirmativo usamos have con I/you/we/they y has con he/she/it. She has a bicycle. Estos posesivos no llevan the delante: my house, no the my house.\nIts es posesivo sin apóstrofo. It’s significa it is o it has según la estructura. Para nombres propios puedes usar ’s: Ana’s book = el libro de Ana.", "form": "She has her book. · They have their books.", "examples": [["My brother has a dog.", "Mi hermano tiene un perro.", "Brother es tercera persona singular: has."], ["We have our tickets.", "Tenemos nuestros boletos.", "Our acompaña a tickets."], ["Ana’s bag is green.", "La bolsa de Ana es verde.", "’s indica posesión."]], "trap": "Its (su, de ello) e it’s (it is / it has) no son lo mismo.", "questions": [{"prompt": "She ___ a bike.", "options": ["have", "has", "are"], "answer": 1, "why": "He/she/it usa has en afirmativo."}, {"prompt": "«Nuestra casa»:", "options": ["our house", "we house", "the our house"], "answer": 0, "why": "Our es posesivo y va antes del nombre."}, {"prompt": "«El libro de Ana»:", "options": ["Ana book", "Ana’s book", "Ana is book"], "answer": 1, "why": "El posesivo ’s une a la persona con lo poseído."}]}, {"title": "Presente simple: afirmaciones", "goal": "Hablar de rutinas y hechos generales.", "rule": "I/you/we/they + verbo base. He/she/it + verbo con -s o -es.", "explanation": "El presente simple describe hábitos, hechos y situaciones relativamente estables: I work on Mondays. No significa necesariamente que la acción ocurre justo ahora.\nEn tercera persona singular añade -s: she works. Watch → watches; study → studies; go → goes; have → has. Con vocal + y, conserva la y: play → plays.\nPalabras como every day, on Fridays y usually ayudan a reconocer una rutina. No añadas am/is/are delante del verbo base: She works, no She is work.", "form": "I work. → She works.", "examples": [["I study every day.", "Estudio todos los días.", "Rutina con I."], ["He works on Mondays.", "Él trabaja los lunes.", "Tercera persona: works."], ["Water boils at 100°C at sea level.", "El agua hierve a 100 °C al nivel del mar.", "Hecho general con condición indicada."]], "trap": "No olvides la -s en tercera persona: She studies English.", "questions": [{"prompt": "She ___ English.", "options": ["study", "studies", "studying"], "answer": 1, "why": "Study cambia a studies con she."}, {"prompt": "They ___ here.", "options": ["works", "work", "is work"], "answer": 1, "why": "They usa verbo base."}, {"prompt": "He ___ to school.", "options": ["go", "goes", "going"], "answer": 1, "why": "Go pasa a goes con he."}]}, {"title": "Presente simple: do y does", "goal": "Negar y hacer preguntas sobre rutinas.", "rule": "Negación: don’t/doesn’t + verbo base. Pregunta: Do/Does + sujeto + verbo base?", "explanation": "Do y does son auxiliares: ayudan a formar la oración. Does acompaña a he/she/it. En preguntas y negativas, el verbo principal vuelve a su forma base.\nShe works → Does she work? → She doesn’t work. La marca de tercera persona ya está en does; no se repite en works.\nRespuestas cortas: Do you study? Yes, I do. Does he study? No, he doesn’t. Esta regla es para verbos comunes; be y los modales se comportan de otra manera.", "form": "Does + she + work? · She + doesn’t + work.", "examples": [["Do you like coffee?", "¿Te gusta el café?", "Do acompaña a you."], ["She doesn’t eat meat.", "Ella no come carne.", "Eat se queda en forma base."], ["Does he live here?", "¿Él vive aquí?", "Does marca la tercera persona."]], "trap": "No digas «Does she works?»: después de does usa work.", "questions": [{"prompt": "Does she ___ here?", "options": ["lives", "live", "living"], "answer": 1, "why": "Does ya marca la tercera persona; usa live."}, {"prompt": "He ___ like tea.", "options": ["don’t", "doesn’t", "isn’t"], "answer": 1, "why": "He necesita doesn’t para negar like."}, {"prompt": "___ they work here?", "options": ["Does", "Are", "Do"], "answer": 2, "why": "They se combina con do cuando preguntas por work."}]}, {"title": "Preguntas y frecuencia", "goal": "Pedir información y describir hábitos.", "rule": "What = qué; where = dónde; when = cuándo; why = por qué; who = quién; how = cómo.", "explanation": "En preguntas con verbos comunes: palabra interrogativa + do/does + sujeto + verbo. Where do you live? Con be: Where are you?\nLos adverbios de frecuencia suelen ir antes del verbo principal: I usually walk. Con be, van después: She is always kind. Always = siempre; usually = normalmente; sometimes = a veces; never = nunca.\nSi who es el sujeto, no se usa do en la pregunta afirmativa básica: Who lives here? Porque preguntamos quién realiza la acción. Why pregunta la razón; because introduce la respuesta.", "form": "Where + do + you + live? · She is always ready.", "examples": [["Where do you work?", "¿Dónde trabajas?", "Where pregunta por lugar."], ["I usually walk to school.", "Normalmente camino a la escuela.", "Usually va antes de walk."], ["Who lives here?", "¿Quién vive aquí?", "Who es el sujeto."]], "trap": "Never ya es negativo: I never smoke, no I don’t never smoke en inglés estándar.", "questions": [{"prompt": "Pregunta por un lugar:", "options": ["Why", "Where", "When"], "answer": 1, "why": "Where significa dónde."}, {"prompt": "Orden habitual:", "options": ["She always is late.", "She is always late.", "Always she late is."], "answer": 1, "why": "Con be, always suele ir después de is."}, {"prompt": "Who ___ here?", "options": ["live", "lives", "does lives"], "answer": 1, "why": "Who funciona como sujeto singular en esta pregunta."}]}, {"title": "There is / there are", "goal": "Decir que algo existe o está en un lugar.", "rule": "There is + singular o incontable. There are + plural.", "explanation": "Estas estructuras corresponden a «hay». There no funciona aquí como el lugar «allá»: There is a park = Hay un parque.\nPara negar: There isn’t a park; There aren’t any chairs. Para preguntar invierte be: Is there a park? Are there any chairs?\nNo confundas existencia con ubicación de algo ya identificado: There is a book on the desk presenta un libro; The book is on the desk dice dónde está el libro conocido.", "form": "There is a chair. · There are two chairs.", "examples": [["There is a bank nearby.", "Hay un banco cerca.", "Bank es singular."], ["There are three windows.", "Hay tres ventanas.", "Windows es plural."], ["Is there any water?", "¿Hay agua?", "Water es incontable."]], "trap": "Para «hay dos libros», usa There are two books, no There is two books.", "questions": [{"prompt": "___ two chairs.", "options": ["There is", "There are", "They is"], "answer": 1, "why": "Two chairs es plural."}, {"prompt": "___ a hospital nearby?", "options": ["Is there", "Are there", "Does there"], "answer": 0, "why": "A hospital es singular: Is there…?"}, {"prompt": "Hay agua:", "options": ["There are water.", "There is water.", "Water there do."], "answer": 1, "why": "Water es incontable y usa is."}]}, {"title": "Contables, some y any", "goal": "Hablar de cantidades sin dar un número exacto.", "rule": "Contables: one apple, two apples. Incontables: water, rice, information.", "explanation": "Los contables tienen unidades y plural. Los incontables se consideran una masa o idea; para contarlos usa una medida: a glass of water, two pieces of information.\nSome suele aparecer en afirmativas; any en negativas y preguntas neutras: I have some rice. I don’t have any rice. Do you have any rice?\nSome también es frecuente al ofrecer o pedir algo esperando una respuesta positiva: Would you like some tea? Los usos dependen de la intención, no de una regla absoluta.", "form": "some apples / some water · not any water", "examples": [["I have some apples.", "Tengo algunas manzanas.", "Apples es contable plural."], ["We don’t have any milk.", "No tenemos leche.", "Any aparece en esta negativa."], ["Would you like some tea?", "¿Te gustaría un poco de té?", "Some en un ofrecimiento."]], "trap": "Information no suele llevar -s: some information, no informations.", "questions": [{"prompt": "Sustantivo normalmente incontable:", "options": ["apple", "chair", "information"], "answer": 2, "why": "Information se trata como incontable."}, {"prompt": "We don’t have ___ milk.", "options": ["any", "a", "an"], "answer": 0, "why": "Any es natural en esta negativa con incontable."}, {"prompt": "Dos vasos de agua:", "options": ["two waters glasses", "two glasses of water", "two water"], "answer": 1, "why": "Usamos una unidad contable: glasses of water."}]}, {"title": "Much, many y a lot of", "goal": "Preguntar cuánto hay.", "rule": "Many + contables plurales. Much + incontables. A lot of funciona con ambos.", "explanation": "How many books? pregunta por un número de libros. How much water? pregunta por una cantidad de agua.\nEn afirmaciones cotidianas suele sonar más natural a lot of: I have a lot of work. Much es común en negativas y preguntas: I don’t have much time.\nA few + contable y a little + incontable expresan una pequeña cantidad disponible. Few y little sin a suelen enfatizar escasez: little time = poco tiempo, quizá insuficiente.", "form": "How many apples? · How much rice?", "examples": [["How many students are here?", "¿Cuántos estudiantes hay aquí?", "Students se cuenta."], ["I don’t have much time.", "No tengo mucho tiempo.", "Time es incontable en este sentido."], ["We have a little milk.", "Tenemos un poco de leche.", "A little con incontable."]], "trap": "No uses many con rice o money en sus usos habituales incontables.", "questions": [{"prompt": "How ___ books?", "options": ["much", "many", "little"], "answer": 1, "why": "Books es contable plural."}, {"prompt": "How ___ money?", "options": ["many", "few", "much"], "answer": 2, "why": "Money se trata como incontable."}, {"prompt": "Un poco de agua:", "options": ["a few water", "a little water", "many water"], "answer": 1, "why": "A little acompaña a incontables."}]}, {"title": "Preposiciones de lugar y tiempo", "goal": "Ubicar cosas y acciones.", "rule": "Lugar: in = dentro/en; on = sobre una superficie; at = un punto. Tiempo: in meses/años, on días/fechas, at horas.", "explanation": "In the box, on the table y at the door son modelos útiles. Las preposiciones no se traducen siempre de forma literal: aprende expresiones completas como at home.\nPara tiempo: in July, in 2026, on Monday, on October 30, at five o’clock. También in the morning, pero at night.\nNormalmente no se añade preposición antes de next, last, this o every en expresiones como next Monday, last year o every day. Hay diferencias regionales: at the weekend es común en Reino Unido; on the weekend en Estados Unidos.", "form": "in 2026 · on Monday · at 8:00", "examples": [["The keys are on the table.", "Las llaves están sobre la mesa.", "On indica superficie."], ["I study at night.", "Estudio por la noche.", "Expresión fija: at night."], ["We meet on Friday.", "Nos reunimos el viernes.", "On con días."]], "trap": "No generalices «en» como in: at 8:00 y on Monday.", "questions": [{"prompt": "___ Monday", "options": ["in", "on", "at"], "answer": 1, "why": "Los días llevan on."}, {"prompt": "___ 7:30", "options": ["on", "in", "at"], "answer": 2, "why": "Las horas llevan at."}, {"prompt": "Dentro de la caja:", "options": ["in the box", "on the box", "at Monday"], "answer": 0, "why": "In indica interior."}]}, {"title": "Presente continuo", "goal": "Expresar acciones en desarrollo.", "rule": "Sujeto + am/is/are + verbo con -ing.", "explanation": "I am studying now describe una acción en curso. El auxiliar be es obligatorio: I studying no es una oración completa en inglés estándar.\nStudy → studying; make → making (cae la e final); run → running (se duplica la n en este patrón). No todos los verbos duplican la consonante: aprende la forma al encontrarla.\nContrasta rutina y acción actual: I work every day / I am working now. Verbos de estado como know suelen usar presente simple: I know, no I am knowing en el uso habitual.", "form": "She + is + reading + now.", "examples": [["She is reading now.", "Ella está leyendo ahora.", "Acción en desarrollo."], ["They are making dinner.", "Están preparando la cena.", "Make pierde la e antes de ing."], ["I work here, but I’m studying today.", "Trabajo aquí, pero hoy estoy estudiando.", "Rutina frente a situación temporal."]], "trap": "No olvides be: She is working, no She working.", "questions": [{"prompt": "She ___ reading now.", "options": ["does", "is", "are"], "answer": 1, "why": "El continuo necesita is con she."}, {"prompt": "Forma -ing de make:", "options": ["makeing", "making", "makking"], "answer": 1, "why": "Make pierde la e final."}, {"prompt": "Rutina: «I ___ every day».", "options": ["am running", "run", "is run"], "answer": 1, "why": "Every day presenta una rutina: presente simple."}]}, {"title": "Can, should y must", "goal": "Hablar de capacidad, consejos y obligación.", "rule": "Modal + verbo base, sin to y sin -s de tercera persona.", "explanation": "Can expresa capacidad o permiso; should suele dar un consejo; must comunica una obligación fuerte o una necesidad según el contexto. She can swim, no She cans swim.\nPara negar, añade not: can’t, shouldn’t, mustn’t. Para preguntar, coloca el modal antes del sujeto: Can you help me?\nMustn’t significa prohibición. Don’t have to significa falta de obligación: no es necesario, pero puedes hacerlo. Esta diferencia cambia el sentido del mensaje.", "form": "She can swim. · You should rest. · You must stop.", "examples": [["I can swim.", "Sé nadar.", "Can + verbo base."], ["You should rest.", "Deberías descansar.", "Consejo."], ["You mustn’t enter.", "No debes entrar.", "Prohibición."]], "trap": "Mustn’t no significa «no hace falta»: para eso usa don’t have to.", "questions": [{"prompt": "She can ___ .", "options": ["swims", "to swim", "swim"], "answer": 2, "why": "Después de can va verbo base sin to."}, {"prompt": "«No es necesario ir»:", "options": ["You mustn’t go.", "You don’t have to go.", "You can’t go."], "answer": 1, "why": "Don’t have to expresa que no hay obligación."}, {"prompt": "Consejo para descansar:", "options": ["You should rest.", "You should to rest.", "You should rests."], "answer": 0, "why": "Should va seguido del verbo base."}]}, {"title": "Pasado de be: was y were", "goal": "Hablar de estados y lugares del pasado.", "rule": "I/he/she/it was · you/we/they were.", "explanation": "Was y were son las formas pasadas de be. Su selección depende del sujeto: I was tired; they were at home.\nPara negar añade not: wasn’t y weren’t. Para preguntar invierte: Were you tired? No añadas did a be en estas estructuras.\nYesterday, last week y in 2020 sitúan la idea en el pasado. Compara I am tired today con I was tired yesterday.", "form": "They were here. → They weren’t here. → Were they here?", "examples": [["I was tired yesterday.", "Ayer estaba cansado.", "I usa was."], ["We were at school.", "Estábamos en la escuela.", "We usa were."], ["Was she at home?", "¿Estaba ella en casa?", "Was antes del sujeto."]], "trap": "Evita «Did you were…?»: la pregunta es Were you…?", "questions": [{"prompt": "I ___ at home yesterday.", "options": ["were", "was", "am"], "answer": 1, "why": "I usa was en pasado."}, {"prompt": "They ___ tired.", "options": ["was", "were", "is"], "answer": 1, "why": "They usa were."}, {"prompt": "Pregunta correcta:", "options": ["Did she was here?", "Was she here?", "Was here she?"], "answer": 1, "why": "Con be invertimos was y she."}]}, {"title": "Pasado simple: acciones", "goal": "Contar lo que ocurrió y terminó.", "rule": "Afirmativa: verbo pasado. Negativa/pregunta: did + verbo base.", "explanation": "Muchos verbos forman el pasado con -ed: work → worked, study → studied. Otros son irregulares: go → went, eat → ate, see → saw.\nDid sirve con todos los sujetos para negar o preguntar: I didn’t go; Did she go? Después de did el verbo vuelve a su forma base.\nUsa pasado simple para hechos ubicados en un tiempo pasado terminado: I visited Puebla last year. La terminación -ed puede sonar /t/, /d/ o /ɪd/; escucha cada ejemplo y no añadas siempre una sílaba extra.", "form": "She went. → She didn’t go. → Did she go?", "examples": [["I visited Puebla last year.", "Visité Puebla el año pasado.", "Pasado terminado."], ["She went home.", "Ella fue a casa.", "Went es pasado de go."], ["Did you see Ana?", "¿Viste a Ana?", "See vuelve a su forma base."]], "trap": "No digas «Did you went?»: usa Did you go?", "questions": [{"prompt": "Pasado de go:", "options": ["goed", "went", "gone"], "answer": 1, "why": "Went es el pasado simple de go."}, {"prompt": "Did she ___ yesterday?", "options": ["worked", "works", "work"], "answer": 2, "why": "Después de did va verbo base."}, {"prompt": "I ___ see him yesterday.", "options": ["don’t", "didn’t", "wasn’t"], "answer": 1, "why": "Didn’t forma la negativa de see en pasado."}]}, {"title": "Futuro: going to y will", "goal": "Expresar planes, predicciones y decisiones.", "rule": "Going to: be + going to + verbo. Will: will + verbo base.", "explanation": "Going to se usa mucho para planes previos y predicciones basadas en evidencias: Look at those clouds. It is going to rain.\nWill es frecuente para decisiones en el momento, promesas y predicciones: I’ll help you. Estas son tendencias de uso; ambos pueden coincidir en ciertos contextos.\nNo mezcles las estructuras: She is going to study o She will study. Will no cambia con he/she/it. La negativa es won’t.", "form": "I am going to study. · I will help.", "examples": [["I’m going to study tonight.", "Voy a estudiar esta noche.", "Plan previo."], ["I’ll answer the phone.", "Yo contestaré el teléfono.", "Decisión del momento."], ["She won’t be late.", "Ella no llegará tarde.", "Won’t = will not."]], "trap": "Después de will no uses to ni -s: She will go.", "questions": [{"prompt": "She ___ going to study.", "options": ["will", "is", "does"], "answer": 1, "why": "Going to necesita be: is con she."}, {"prompt": "I will ___ you.", "options": ["help", "to help", "helps"], "answer": 0, "why": "Will se combina con verbo base."}, {"prompt": "Negativa de will:", "options": ["willn’t", "won’t", "doesn’t will"], "answer": 1, "why": "Won’t es la contracción de will not."}]}, {"title": "Comparativos y superlativos", "goal": "Comparar dos cosas y destacar una dentro de un grupo.", "rule": "Comparativo: -er / more + adjetivo + than. Superlativo: the -est / the most + adjetivo.", "explanation": "Con adjetivos cortos es común -er y -est: small, smaller, the smallest. Si terminan en consonante + y: happy, happier, the happiest.\nCon muchos adjetivos largos usa more y most: more expensive, the most expensive. Hay irregulares: good → better → best; bad → worse → worst.\nThan introduce el segundo elemento de comparación. El superlativo suele llevar the cuando identifica el máximo del grupo. También puedes igualar: as tall as = tan alto como.", "form": "smaller than · more useful than · the best", "examples": [["This book is cheaper than that one.", "Este libro es más barato que aquel.", "Cheap añade -er."], ["This is the most useful tool.", "Esta es la herramienta más útil.", "Most con useful."], ["She is as tall as me.", "Ella es tan alta como yo.", "As…as expresa igualdad."]], "trap": "No combines more y -er en la comparación estándar: better, no more better.", "questions": [{"prompt": "Comparativo de good:", "options": ["gooder", "more good", "better"], "answer": 2, "why": "Good tiene comparativo irregular: better."}, {"prompt": "Más caro que:", "options": ["more expensive than", "expensiver that", "most expensive than"], "answer": 0, "why": "Expensive usa more; than conecta la comparación."}, {"prompt": "El más pequeño:", "options": ["the smallest", "the most smaller", "smaller than"], "answer": 0, "why": "Smallest es el superlativo de small."}]}, {"title": "Presente perfecto", "goal": "Conectar una experiencia o un hecho pasado con el presente.", "rule": "Sujeto + have/has + participio pasado.", "explanation": "El participio coincide con -ed en verbos regulares, pero puede ser distinto en irregulares: go → gone; see → seen; eat → eaten. I have seen that movie habla de una experiencia sin indicar cuándo terminó.\nCompara I saw it yesterday (pasado simple con tiempo terminado) e I have seen it (experiencia conectada con el presente). No combines normalmente presente perfecto con yesterday o last year.\nSince señala el inicio: since 2020. For señala duración: for six years. Con situaciones que continúan, el presente perfecto expresa «desde entonces hasta ahora».", "form": "She has visited Puebla. · I have lived here for two years.", "examples": [["I have seen that movie.", "He visto esa película.", "Experiencia sin fecha terminada."], ["She has lived here since 2020.", "Ella vive aquí desde 2020.", "Since señala el inicio."], ["Have you ever tried sushi?", "¿Alguna vez has probado sushi?", "Ever pregunta por una experiencia."]], "trap": "No confundas went (pasado) con gone (participio): has gone, no has went.", "questions": [{"prompt": "She ___ seen this movie.", "options": ["have", "has", "is"], "answer": 1, "why": "She usa has en presente perfecto."}, {"prompt": "I have lived here ___ 2020.", "options": ["for", "since", "during"], "answer": 1, "why": "Since introduce el momento inicial."}, {"prompt": "Con yesterday, elige:", "options": ["I have seen him yesterday.", "I saw him yesterday.", "I has see him yesterday."], "answer": 1, "why": "Yesterday es un tiempo terminado: pasado simple."}]}, {"title": "Conectores y condicionales", "goal": "Unir ideas y expresar consecuencias posibles o hipotéticas.", "rule": "Because explica una causa; but contrasta; so introduce una consecuencia. First conditional: if + presente, will + verbo.", "explanation": "I stayed home because I was tired expresa una causa. I was tired, so I stayed home presenta la consecuencia. No dupliques because y so como si fueran obligatorios en la misma estructura.\nPara una condición futura posible: If it rains, we will stay home. Aunque hables del futuro, la parte con if usa presente en este modelo.\nPara una situación hipotética: If I had more time, I would study more. Aquí had no cuenta necesariamente un hecho pasado: marca distancia de la realidad. If I were you es una fórmula habitual para aconsejar.", "form": "If it rains, we will stay home. · If I had time, I would help.", "examples": [["I stayed home because I was tired.", "Me quedé en casa porque estaba cansado.", "Because introduce la causa."], ["If it rains, we’ll stay home.", "Si llueve, nos quedaremos en casa.", "Condición futura posible."], ["If I were you, I would rest.", "Si yo fuera tú, descansaría.", "Consejo hipotético."]], "trap": "En el primer condicional básico evita «If it will rain»: usa If it rains.", "questions": [{"prompt": "If it ___, we will stay home.", "options": ["will rain", "rains", "raining"], "answer": 1, "why": "En esta cláusula con if usamos presente simple."}, {"prompt": "Conector de causa:", "options": ["because", "but", "or"], "answer": 0, "why": "Because introduce una razón."}, {"prompt": "If I had time, I ___ help.", "options": ["will", "would", "am"], "answer": 1, "why": "La hipótesis usa would + verbo base."}]}, {"title": "Pronombres de objeto y repaso final", "goal": "Elegir pronombres según su función y combinar lo aprendido.", "rule": "Sujeto: I, you, he, she, it, we, they. Objeto: me, y function route(){return `<section class="hero"><div><span class="eyebrow">UN CAMINO CLARO, DESDE LA PRIMERA PALABRA</span><h1>El inglés empieza<br>por las raíces.</h1><p>Comprende cómo se construye una oración. Avanza paso a paso, con explicaciones en español y pequeños ejercicios que te muestran el porqué.</p><div class="spaced"><button class="primary" id="continue">${Object.keys(state.cards).length?'Continuar mi camino':'Empezar desde cero'} ↗</button><button class="ghost" data-page="guide">Cómo estudiar</button></div><p class="small muted">24 lecciones · 72 ejercicios · sin límite de intentos</p></div><div class="art" aria-hidden="true"><div class="eyebrow">DE LAS PIEZAS A LA IDEA</div><div class="big">🌱</div><em>I am learning.</em><div class="blocks"><span>Yo</span><span>estoy</span><span>aprendiendo</span></div><p class="small muted">Una base firme. Una idea nueva cada día.</p></div></section>${stats()}<div class="section-head"><div><span class="eyebrow">TU RUTA DE APRENDIZAJE</span><h2>Primero comprende. Después practica.</h2></div><span class="small muted" id="resultCount"></span></div><p class="muted">Sigue el orden recomendado o entra al tema que necesites. Todas las lecciones están disponibles.</p><div class="filters"><button data-filter="-1" class="${filter<0?'active':''}">Toda la ruta</button>${GROUPS.map((g,i)=>`<button data-filter="${i}" class="${filter===i?'active':''}">${i+1}. ${g}</button>`).join('')}<input id="search" type="search" aria-label="Buscar lecciones" placeholder="Buscar: pronombres, pasado, preguntas…" value="${esc(search)}"></div><div class="cards" id="lessonCards"></div>`}

 y resultados de estos ejercicios; no certifica un nivel de inglés ni evalúa tu pronunciación.</p></section>`}
function guide(){return `<span class="eyebrow">APRENDER ES COMPRENDER Y VOLVER A USAR</span><h1>Un método pequeño.<br>Una base duradera.</h1><section class="panel"><h2>Audio a tu ritmo</h2><div class="settings"><label>Acento <select id="accent"><option value="en-US" ${state.accent==='en-US'?'selected':''}>Estadounidense</option><option value="en-GB" ${state.accent==='en-GB'?'selected':''}>Británico</option></select></label><label>Velocidad <select id="rate">${[.6,.75,.85,1].map(n=>`<option value="${n}" ${Number(state.rate)===n?'selected':''}>${n}×</option>`).join('')}</select></label><button id="testVoice">♪ Escuchar ejemplo</button></div><p class="small muted">El audio usa las voces del navegador. Su disponibilidad y calidad dependen del dispositivo; algunas necesitan conexión. Si no hay una voz del acento elegido, se intentará otra voz en inglés. Los efectos de interfaz se pueden silenciar por separado.</p></section><div class="twocol" style="margin-top:18px">${[['01 · Observa la idea','Lee la idea clave y busca el sujeto y el verbo en los ejemplos. Relaciona cada pieza con la explicación. No intentes memorizar toda la página de una vez.'],['02 · Explica sin mirar','Cierra los ojos y explica la regla con tus propias palabras. Si no puedes, vuelve al paso que te faltó comprender. Aprender una regla no es repetir su definición.'],['03 · Escucha y transforma','Escucha una oración y repítela. Cambia una palabra para hablar de ti: I study English → I study music. En temas que lo permitan, crea su pregunta y su negativa.'],['04 · Practica y vuelve','Responde los ejercicios sin mirar la regla. Lee la retroalimentación aunque aciertes. Repasa mañana y en unos días: la página no envía notificaciones ni programa recordatorios.']].map(([h,p])=>`<section class="panel"><h3>${h}</h3><p>${p}</p></section>`).join('')}</div><section class="panel" style="margin-top:18px"><h2>Pequeño diccionario para empezar</h2>${[['Sujeto','De quién se habla o quién realiza la acción: She en She reads.'],['Verbo','Expresa una acción o estado: read, work, be. Su forma puede cambiar según tiempo y sujeto.'],['Sustantivo','Nombra personas, cosas, lugares o ideas: teacher, book, city, happiness.'],['Adjetivo','Describe un sustantivo: a small house. En inglés normalmente no cambia por género ni por número.'],['Auxiliar','Ayuda a construir preguntas, negativas o tiempos: do en Do you work?; have en I have worked.'],['Verbo base','Forma sin to y sin terminaciones de conjugación: work, go, study. También se llama infinitivo sin to.'],['Participio pasado','Forma usada, entre otras estructuras, con have: worked, seen, gone. No siempre coincide con el pasado simple.'],['Contracción','Dos palabras se unen y se omiten letras: I am → I’m; do not → don’t. El apóstrofo señala esa omisión.'],['Contable e incontable','Un contable puede contarse directamente: two books. Un incontable suele necesitar una unidad: two glasses of water.']].map(([h,p])=>`<details><summary>${h}</summary><p>${p}</p></details>`).join('')}</section><section class="panel" style="margin-top:18px"><h2>Preguntas que suelen aparecer</h2>${[['¿Debo seguir el orden?','Es lo recomendable al comenzar desde cero. Las primeras seis lecciones presentan las piezas; las siguientes construyen estructuras. Todas están abiertas para que también puedas consultar dudas.'],['¿Marcar como leída cuenta como aprobar?','No. Leída indica que tú revisaste la explicación. Practicada indica que terminaste los tres ejercicios. La marca 3/3 indica que lograste todos los aciertos al menos una vez.'],['¿Por qué solo tres ejercicios por lección?','Son una comprobación breve de la idea central, no una evaluación completa. Complementa cada tema creando tus propias frases y usándolas en conversaciones.'],['¿Puedo usarlo en GitHub Pages?','Sí. Todo el contenido, los estilos y el código están en este index.html. No necesita librerías externas ni base de datos. El audio depende del navegador y sus voces.'],['¿Se guarda mi progreso?','Sí, si tu navegador permite almacenamiento local. En navegación privada o al borrar datos puedes perderlo. Exporta un respaldo. El archivo no envía tus resultados a un servidor.'],['¿Qué hago si no comprendo una explicación?','Vuelve a la lección anterior que presenta sus piezas. Copia un ejemplo y sustituye una sola palabra. Repite el patrón antes de combinar varias reglas nuevas.']].map(([h,p])=>`<details><summary>${h}</summary><p>${p}</p></details>`).join('')}</section>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='lesson'&&b.dataset.page==='route')));$('#view').innerHTML=page==='route'?route():page==='lesson'?lesson():page==='progress'?progress():page==='review'?'<button data-page="progress">← Volver a Progreso</button><h1>Un repaso para afianzar.</h1><p class="muted">Recuerda la regla antes de elegir. Cada respuesta incluye su explicación.</p><div class="reading" id="quizArea" aria-live="polite"></div>':guide();if(page==='route')listCards();if(quiz&&(page==='lesson'||page==='review'))renderQuiz()}
function confirmWith(title,text,fn){$('#dialogTitle').textContent=title;$('#dialogText').textContent=text;confirmAction=fn;$('#confirmDialog').showModal()}
function shuffled(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function validateBackup(d){if(!d||d.app!=='english-roots'||d.version!==1||!d.progress||typeof d.progress.cards!=='object'||Array.isArray(d.progress.cards)||!d.progress.days||typeof d.progress.days!=='object'||Array.isArray(d.progress.days))throw Error();let cards={},days={};for(let[k,v]of Object.entries(d.progress.cards)){if(!/^\d+$/.test(k)||+k>23||!v||typeof v.read!=='boolean'||!Number.isInteger(v.attempts)||v.attempts<0||!Number.isInteger(v.best)||v.best<0||v.best>3||!Number.isInteger(v.latest)||v.latest<0||v.latest>3||!Array.isArray(v.wrong)||v.wrong.some(n=>!Number.isInteger(n)||n<0||n>2))throw Error();cards[k]={read:v.read,attempts:v.attempts,best:v.best,latest:v.latest,wrong:[...new Set(v.wrong)]}}for(let[k,v]of Object.entries(d.progress.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Number.isInteger(v)||v<0)throw Error();days[k]=v}return{cards,days,last:Number.isInteger(d.progress.last)&&d.progress.last>=0&&d.progress.last<24?d.progress.last:0}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='theme'){state.theme=state.theme==='dark'?'light':'dark';preferences();persist();sound();return}if(b.id==='sound'){state.sound=!state.sound;preferences();persist();sound();return}if(b.dataset.answer!==undefined){answer(+b.dataset.answer);return}if(b.dataset.example!==undefined){speak(LESSONS[current].examples[+b.dataset.example][0]);return}sound();if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.open!==undefined){openLesson(+b.dataset.open);return}if(b.dataset.filter!==undefined){filter=+b.dataset.filter;render();return}switch(b.id){case'continue':openLesson(state.last);break;case'markRead':{let x=info(current);x.read=!x.read;state.cards[current]=x;persist();b.textContent=x.read?'✓ Lección marcada como leída':'Marcar como leída';b.setAttribute('aria-pressed',String(x.read));break}case'practice':startQuiz();break;case'nextQuestion':nextQuestion();break;case'repeatQuiz':{let mode=quiz.mode,items=quiz.items.slice();startQuiz(mode,items);break}case'reviewWrong':{let items=[];LESSONS.forEach((l,i)=>info(i).wrong.forEach(q=>items.push({l:i,q})));if(!items.length){toast('No hay errores pendientes. Haz una práctica de lección para empezar.');break}startQuiz('errors',shuffled(items));break}case'mixedQuiz':{let items=[];LESSONS.forEach((l,i)=>{let x=info(i);if(x.read||x.attempts)l.questions.forEach((_,q)=>items.push({l:i,q}))});if(!items.length){toast('Primero lee o completa la práctica de una lección.');break}startQuiz('mixed',shuffled(items).slice(0,12));break}case'testVoice':speak('I am learning English, step by step.');break;case'export':{let blob=new Blob([JSON.stringify({app:'english-roots',version:1,progress:{cards:state.cards,days:state.days,last:state.last}},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='english-roots-progreso.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);break}case'reset':confirmWith('¿Borrar tu progreso?','Se eliminarán tus marcas de lectura, resultados y actividad. Exporta un respaldo antes si quieres conservarlos. Tus ajustes de tema y audio se mantendrán.',()=>{state.cards={};state.days={};state.last=0;current=0;quiz=null;persist();render();toast('Progreso borrado')});break;case'cancelDialog':$('#confirmDialog').close();confirmAction=null;break;case'acceptDialog':{let fn=confirmAction;confirmAction=null;$('#confirmDialog').close();if(fn)fn();break}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;listCards()}});document.addEventListener('change',async e=>{let t=e.target;if(t.id==='lessonSelect')openLesson(+t.value);if(t.id==='accent'){state.accent=t.value;persist()}if(t.id==='rate'){state.rate=Number(t.value);persist()}if(t.id==='import'&&t.files[0]){try{if(t.files[0].size>2000000)throw Error();let p=validateBackup(JSON.parse(await t.files[0].text()));confirmWith('¿Importar este respaldo?','El progreso de este respaldo reemplazará el avance actual. Los ajustes de tema y audio se mantendrán.',()=>{Object.assign(state,p);current=p.last;quiz=null;persist();render();toast('Progreso importado')})}catch{toast('El archivo no es un respaldo válido de English Roots.')}t.value=''}});$('#confirmDialog').addEventListener('cancel',()=>confirmAction=null);preferences();render();
</script></body></html>
